name: Build & Release APK - İndir Gitsin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          ls -R www || true

      - name: Install deps
        run: |
          npm install
          pip install -r server/requirements.txt || true

      - name: Init Capacitor (if not exists)
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew missing -> (re)creating android platform"
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Patch AndroidManifest & MainActivity for Share Intent
        run: |
          TEMPLATE=".github/AndroidManifest.xml"
          TARGET="android/app/src/main/AndroidManifest.xml"
          if [ -f "$TEMPLATE" ]; then
            echo "Applying Share Intent manifest from $TEMPLATE -> $TARGET"
            cp "$TEMPLATE" "$TARGET"
          fi
          grep -q "android.intent.action.SEND" "$TARGET" && echo "SEND intent OK" || echo "SEND intent MISSING"
          cat "$TARGET" || true
          # Ensure FileProvider file_paths.xml exists (required by AndroidManifest)
          mkdir -p android/app/src/main/res/xml
          if [ ! -f "android/app/src/main/res/xml/file_paths.xml" ]; then
            cat > android/app/src/main/res/xml/file_paths.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="." />
              <external-files-path name="external_files" path="." />
              <external-cache-path name="external_cache" path="." />
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          XML
            echo "Created file_paths.xml"
          fi
          cat android/app/src/main/res/xml/file_paths.xml || true
          # Patch MainActivity to handle SEND -> load https://localhost/?text=
          JAVA_TMPL=".github/MainActivity.java"
          JAVA_TARGET="android/app/src/main/java/com/indirgitsin/app/MainActivity.java"
          if [ -f "$JAVA_TMPL" ]; then
            echo "Applying custom MainActivity.java"
            mkdir -p "$(dirname "$JAVA_TARGET")"
            cp "$JAVA_TMPL" "$JAVA_TARGET"
            cat "$JAVA_TARGET" || true
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace || echo "Release build skipped (needs signing)"
        continue-on-error: true

      - name: Find APKs
        run: |
          find android -name "*.apk" -type f | head -20
          ls -lh android/app/build/outputs/apk/debug/ || true
          ls -lh android/app/build/outputs/apk/release/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: indir-gitsin-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "İndir Gitsin v${{ github.run_number }}"
          body: |
            ## İndir Gitsin - Otomatik Sürüm

            **Commit:** ${{ github.sha }}
            **Tarih:** ${{ github.event.head_commit.timestamp }}

            ### Yenilikler
            - YouTube & YouTube Music desteği
            - Paylaş → İndir Gitsin entegrasyonu
            - Modern glassmorphism arayüz

            ### Kurulum
            APK dosyasını indirip Android cihazına yükle (Bilinmeyen kaynaklara izin ver).

            ### Test (APK olmadan)
            `python server/app.py` ile tarayıcıdan http://localhost:8000 üzerinden test edilebilir.

          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

